
name: ci-devlaunch

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: services/examples/kramelworks-devlaunch-api/package-lock.json

      - name: Install dependencies
        working-directory: services/examples/kramelworks-devlaunch-api
        run: npm ci

      - name: Build API
        working-directory: services/examples/kramelworks-devlaunch-api
        run: npm run build

  build-client:
    name: Build Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: services/examples/kramelworks-devlaunch-client/package-lock.json

      - name: Install dependencies
        working-directory: services/examples/kramelworks-devlaunch-client
        run: npm ci

      - name: Build Client
        working-directory: services/examples/kramelworks-devlaunch-client
        run: npm run build

  publish:
    name: Publish Docker images
    needs:
      - build-api
      - build-client

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: ./services/examples/kramelworks-devlaunch-api
          push: true
          tags: |
            ghcr.io/kramelworks-admin/kws-devlaunch-example-api:latest
            ghcr.io/kramelworks-admin/kws-devlaunch-example-api:${{ github.sha }}

      - name: Build and publish Client
        uses: docker/build-push-action@v6
        with:
          context: ./services/examples/kramelworks-devlaunch-client
          push: true
          tags: |
            ghcr.io/kramelworks-admin/kws-devlaunch-example-client:latest
            ghcr.io/kramelworks-admin/kws-devlaunch-example-client:${{ github.sha }}
  deploy:
    name: Deploy to Debian
    needs: publish
    runs-on: self-hosted

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    timeout-minutes: 10

    steps:
      - name: Deploy application
        run: /home/kamelworks/devlaunch/deploy.sh

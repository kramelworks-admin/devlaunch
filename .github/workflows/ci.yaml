name: ci-devlaunch-api

defaults:
  run:
    working-directory: services/examples/kramelworks-devlaunch-api

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./services/examples/kramelworks-devlaunch-api
          push: true
          tags: |
            ghcr.io/kramelworks-admin/kws-devlaunch-example-api:latest
            ghcr.io/kramelworks-admin/kws-devlaunch-example-api:${{ github.sha }}

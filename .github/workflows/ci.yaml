name: ci-devlaunch-api

defaults:
  run:
    working-directory: services/examples/kramelworks-devlaunch-api

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24.x"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

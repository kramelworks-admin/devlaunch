name: kramelworks-devlaunch

services:
  api:
    build:
      context: kramelworks-devlaunch-api
    image: kws-devlaunch-api:latest
    container_name: kws-devlaunch-api
    command: ["node", "dist/server.js"]
    restart: unless-stopped
    environment:
      PORT: ${API_PORT}
      NODE_ENV: ${NODE_ENV}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
      - backend

  client:
    build:
      context: kramelworks-devlaunch-client
    image: kws-devlaunch-client:latest
    container_name: kws-devlaunch-client
    command: ["node", "dist/client.js"]
    restart: unless-stopped
    environment:
      PORT: ${CLIENT_PORT:?CLIENT_PORT is required}
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      API_URL: ${API_URL:?API_URL is required}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:?REQUEST_TIMEOUT_MS is required}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://127.0.0.1:8000'), fetch('http://127.0.0.1:8000/upstream')]).then(responses => process.exit(responses.every(r => r.ok) ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:8000"
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

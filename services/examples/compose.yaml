name: kramelworks-devlaunch

services:
  api:
    image: ghcr.io/kramelworks-admin/kws-devlaunch-example-api:latest
    container_name: kws-devlaunch-api
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
      - backend

  client:
    image: ghcr.io/kramelworks-admin/kws-devlaunch-example-client:latest
    container_name: kws-devlaunch-client
    restart: unless-stopped
    environment:
      - API_URL=http://api:8001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:8000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://127.0.0.1:8000'), fetch('http://127.0.0.1:8000/upstream')]).then(responses => process.exit(responses.every(r => r.ok) ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

name: kramelworks-devlaunch

services:
  api:
    image: ghcr.io/kramelworks-admin/kws-devlaunch-example-api:latest
    container_name: kws-devlaunch-api
    restart: unless-stopped
    networks:
      - frontend
      - backend

  client:
    image: ghcr.io/kramelworks-admin/kws-devlaunch-example-client:latest
    container_name: kws-devlaunch-client
    restart: unless-stopped
    environment:
      - API_URL=http://api:8001
    depends_on:
      - api
    ports:
      - "80:8000"
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
